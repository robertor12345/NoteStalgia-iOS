name: MellorityFlowPOC
options:
  bundleIdPrefix: com.melloria
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    PRODUCT_BUNDLE_IDENTIFIER: com.melloria.flowpoc
    INFOPLIST_FILE: App/Info.plist
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_COMPILATION_MODE: singlefile
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      GCC_OPTIMIZATION_LEVEL: "3"
      DEAD_CODE_STRIPPING: true
targets:
  MellorityFlowPOC:
    type: application
    platform: iOS
    sources:
      - App
      - Core
      - Flow
      - Screens
    resources:
      - path: App/Resources
        type: folder
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Mellority Flow
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSFaceIDUsageDescription: Reserved for a future release; supervisor PIN is used for staff access in this build.
        NSCameraUsageDescription: Mellority captures your environment to tailor visuals and sound to the moment.
        NSPhotoLibraryUsageDescription: Choose a photo to analyse colour and mood for your session.
        NSMicrophoneUsageDescription: Spatial audio and session capture may use the microphone when you enable those features.
        NSHealthShareUsageDescription: Optional heart rate and mindfulness data help adapt your session when you connect Health.
        NSHealthUpdateUsageDescription: Optional wellness updates when you connect Health.
    dependencies: []

schemes:
  MellorityFlowPOC:
    build:
      targets:
        MellorityFlowPOC: all
    run:
      config: Debug
