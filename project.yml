name: NoteStalgia-iOS
options:
  bundleIdPrefix: com.notestalgia
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    PRODUCT_BUNDLE_IDENTIFIER: com.notestalgia.ios
    INFOPLIST_FILE: App/Info.plist
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_COMPILATION_MODE: singlefile
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      GCC_OPTIMIZATION_LEVEL: "3"
      DEAD_CODE_STRIPPING: true
targets:
  NoteStalgia-iOS:
    type: application
    platform: iOS
    sources:
      - App
      - Core
      - Flow
      - Screens
    resources:
      - path: App/Resources
        type: folder
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: NoteStalgia
        UILaunchScreen:
          UIColorName: LaunchBackground
        CADisableMinimumFrameDurationOnPhone: true
        # The simulator talks to `wrangler dev` on http://localhost:8787 (-NoteStalgiaAPIBaseURL); loopback only.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSFaceIDUsageDescription: Reserved for a future release; supervisor PIN is used for staff access in this build.
        NSCameraUsageDescription: NoteStalgia captures your environment to tailor visuals and sound to the moment.
        NSPhotoLibraryUsageDescription: Choose a photo to analyse colour and mood for your session.
        NSMicrophoneUsageDescription: Spatial audio and session capture may use the microphone when you enable those features.
        NSHealthShareUsageDescription: Optional heart rate and mindfulness data help adapt your session when you connect Health.
        NSHealthUpdateUsageDescription: Optional wellness updates when you connect Health.
    dependencies: []

  # Scripted demo walkthroughs (see tools/demo/README.md). Not shipped; drives the app for recordings.
  NoteStalgiaDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - DemoUITests
    dependencies:
      - target: NoteStalgia-iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.notestalgia.ios.demouitests
        TEST_TARGET_NAME: NoteStalgia-iOS
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic

  # Pure-logic tests (input rules); mirrors the Worker's test/validate.test.ts.
  NoteStalgiaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: NoteStalgia-iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.notestalgia.ios.tests
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic

schemes:
  NoteStalgia-iOS:
    build:
      targets:
        NoteStalgia-iOS: all
        NoteStalgiaDemoUITests: [test]
    run:
      config: Debug
      commandLineArguments:
        # Deployed POC backend (Cloudflare Worker). Untick in Xcode to run fully offline.
        "-NoteStalgiaAPIBaseURL https://notestalgia-api.fitraclesub.workers.dev": true
    test:
      config: Debug
      targets:
        - NoteStalgiaDemoUITests

  # Unit tests only (input rules, set-up wizard model). Kept out of the main scheme: `@testable import` needs a
  # Debug build, and the demo recordings build that scheme in Release.
  NoteStalgia-Unit:
    build:
      targets:
        NoteStalgia-iOS: all
        NoteStalgiaTests: [test]
    test:
      config: Debug
      targets:
        - NoteStalgiaTests
